name: Agentcoin checks
on:
  push:
  pull_request:
concurrency:
  group: agentcoin-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check every tracked module
        run: git ls-files -z '*.mjs' | xargs -0 -r -n 1 node --check
      - name: Check inline browser scripts
        run: |
          node tools/check-html-scripts.mjs
          node tools/build-site-release.mjs --check
      - name: Core security regressions
        run: |
          node test/core-smoke.mjs
          node test/p0-signature-binding.mjs
          node test/sec-01-escrow-p2p.mjs
          node test/accept-A1-registry.mjs
          node test/cabinet-cancel-unit.mjs
      - name: Identity portability and node recovery
        run: >-
          node --test test/agent-identity.mjs test/agent-profile.mjs
          test/cabinet-client.mjs test/cabinet-portability.mjs test/cabinet-auth.mjs
          test/watchdog-incident.mjs test/health-check-incident.mjs
          test/sync-concurrency.mjs test/node-monitor.mjs
          test/site-release.mjs test/agent-node-setup.mjs test/address-configuration.mjs
