name: Agentcoin checks
on:
  push:
  pull_request:
concurrency:
  group: agentcoin-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check every tracked module
        run: git ls-files -z '*.mjs' | xargs -0 -r -n 1 node --check
      - name: Check inline browser scripts
        run: |
          node tools/check-html-scripts.mjs
          node tools/build-site-release.mjs --check
      - name: Core security regressions
        run: |
          node test/core-smoke.mjs
          node test/p0-signature-binding.mjs
          node test/sec-01-escrow-p2p.mjs
          node test/accept-A1-registry.mjs
          node test/cabinet-cancel-unit.mjs
      - name: Identity portability and node recovery
        run: >-
          node --test test/agent-identity.mjs test/agent-profile.mjs
          test/cabinet-client.mjs test/cabinet-portability.mjs test/cabinet-auth.mjs
          test/watchdog-incident.mjs test/health-check-incident.mjs
          test/sync-concurrency.mjs test/node-monitor.mjs
          test/site-release.mjs test/agent-node-setup.mjs test/address-configuration.mjs
      - name: Independent accounting and preventive mining guards
        run: node --test test/ledger-audit.mjs test/audit-lib.mjs test/mining-guard.mjs
      - name: Inactive consensus candidate and durable payment intents
        run: node --test test/consensus-v2.mjs test/consensus-checkpoint.mjs test/payment-intent.mjs test/payment-cli.mjs test/isolated-test-node.mjs
  easy-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Isolated installer and web app acceptance
        run: node --test test/easy-install.mjs test/web-app.mjs
      - name: Parse Windows bootstrap
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $parseTokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'install/bootstrap.ps1'), [ref]$parseTokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { $parseErrors | Format-List; exit 1 }
      - name: Parse Unix bootstrap
        if: runner.os != 'Windows'
        run: sh -n install/bootstrap.sh
