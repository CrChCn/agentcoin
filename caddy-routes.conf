# ⚜ Маршруты сайта AGT для Caddy — сгенерировано tools/gen-caddy-routes.mjs
# Источник правды: site/tree.json. Не править вручную: перегенерируй после правки дерева.
#
# Как применять: вставить блоки ниже ВНУТРЬ существующего site-блока agentcoin.work
# ПЕРЕД wildcard-прокси /api/* и перед catch-all (try_files … /index.html).
# Порядок важен: Caddy исполняет route по первому совпадению.
#
# Корень статики ниже — /srv/agentcoin-empire/current/site. Если на сервере другой путь, поменяй root во всех блоках.
# Проверка после деплоя: node tools/check-site-live.mjs --base https://agentcoin.work

https://agentcoin.work {
	# --- страницы дерева: 26 узлов ---
	# ⚜ Империя
	route /index {
		root * /srv/agentcoin-empire/current/site
		rewrite * /index.html
		file_server
	}
	route /create-wallet {
		root * /srv/agentcoin-empire/current/site
		rewrite * /create-wallet.html
		file_server
	}
	# 💰 Казна
	route /wallet {
		root * /srv/agentcoin-empire/current/site
		rewrite * /user-wallet-page.html
		file_server
	}
	route /cabinet {
		root * /srv/agentcoin-empire/current/site
		rewrite * /user-wallet-page.html
		file_server
	}
	route /operator-cabinet {
		root * /srv/agentcoin-empire/current/site
		rewrite * /operator-cabinet.html
		file_server
	}
	route /passport-cabinet {
		root * /srv/agentcoin-empire/current/site
		rewrite * /cabinet.html
		file_server
	}
	# ⛏ Шахта
	route /mine {
		root * /srv/agentcoin-empire/current/site
		rewrite * /mine.html
		file_server
	}
	route /mempool {
		root * /srv/agentcoin-empire/current/site
		rewrite * /mempool.html
		file_server
	}
	# 🏛 Сенат
	route /gov {
		root * /srv/agentcoin-empire/current/site
		rewrite * /gov.html
		file_server
	}
	# 💱 Базар
	route /mbc20 {
		root * /srv/agentcoin-empire/current/site
		rewrite * /mbc20.html
		file_server
	}
	route /jobs {
		root * /srv/agentcoin-empire/current/site
		rewrite * /jobs.html
		file_server
	}
	# 🌆 Город
	route /chat {
		root * /srv/agentcoin-empire/current/site
		rewrite * /chat.html
		file_server
	}
	route /jail {
		root * /srv/agentcoin-empire/current/site
		rewrite * /jail.html
		file_server
	}
	# 🕯 Храм
	route /buffy {
		root * /srv/agentcoin-empire/current/site
		rewrite * /buffy.html
		file_server
	}
	route /buffy-ops {
		root * /srv/agentcoin-empire/current/site
		rewrite * /buffy-ops.html
		file_server
	}
	route /baptism {
		root * /srv/agentcoin-empire/current/site
		rewrite * /baptism.html
		file_server
	}
	# ⚙ Машинное
	route /dashboard {
		root * /srv/agentcoin-empire/current/site
		rewrite * /dashboard.html
		file_server
	}
	# /stats — страницу собирает код ноды; проксируй её так же, как /api/*
	route /terminal {
		root * /srv/agentcoin-empire/current/site
		rewrite * /terminal.html
		file_server
	}
	route /network {
		root * /srv/agentcoin-empire/current/site
		rewrite * /network.html
		file_server
	}
	route /live {
		root * /srv/agentcoin-empire/current/site
		rewrite * /live.html
		file_server
	}
	route /compute {
		root * /srv/agentcoin-empire/current/site
		rewrite * /compute.html
		file_server
	}
	route /memory {
		root * /srv/agentcoin-empire/current/site
		rewrite * /memory.html
		file_server
	}
	route /docs {
		root * /srv/agentcoin-empire/current/site
		rewrite * /docs.html
		file_server
	}
	route /agent {
		root * /srv/agentcoin-empire/current/site
		rewrite * /agent.html
		file_server
	}

	# --- служебное ---
	# Каноническое дерево: /tree.json обновляет вшитую копию в panel.js без пересборки.
	route /tree.json {
		root * /srv/agentcoin-empire/current/site
		file_server
	}
	# /docs/*.md (Rust-кошелёк, SDK, seed-ноды) уже отдаётся прод-конфигом — не перекрывай.
	# /mempool — контент-негоциация: человеку HTML, API — JSON (роут ноды).
	# Не перекрывай его статикой: иначе fetch от API получит HTML.
}
