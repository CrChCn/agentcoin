# Блок для /etc/caddy/Caddyfile на node1.agentcoin.work
# Два новых маршрута AC-1 и AC-2 из ТЗ. Вставить внутрь существующего site-блока
# agentcoin.work (или вместо comment-блока ниже, если прод-конфиг переписывается с нуля).
# Формат соответствует ТЗ (раздел 4); снять комментарий, если /opt/agentcoin-working/site
# ещё не создан — иначе Caddy упадёт с «no such directory».

# /opt/agentcoin-working/site должен содержать:
#   create-wallet.html, live.html, wasm/agentcoin_wasm.js, wasm/agentcoin_wasm_bg.wasm

https://agentcoin.work {
	# --- AC-1: /create-wallet (WASM-кошелёк) ---
	route /create-wallet {
		root * /opt/agentcoin-working/site
		rewrite * /create-wallet.html
		file_server
	}

	# --- AC-2: /live («Окно в Империю») ---
	route /live {
		root * /opt/agentcoin-working/site
		rewrite * /live.html
		file_server
	}

	# --- статика WASM для кошелька ---
	# Caddy сам отдаёт правильные mime: agentcoin_wasm.js → text/javascript,
	# agentcoin_wasm_bg.wasm → application/wasm (нужно для instantiateStreaming)
	route /wasm/* {
		root * /opt/agentcoin-working/site
		file_server
	}
}

# NOTE: если блок agentcoin.work уже существует (как сейчас на проде:
# root * /srv/agentcoin-empire/current + прокси API на node1/2/3),
# НЕ создавайте второй site-блок — Caddy откажется парсить дубль домена.
# В живом Caddyfile вместо нового блока добавьте route-диры выше в
# существующий блок agentcoin.work, до wildcard-прокси /api/*.
