# bridge-h1-caddy-snippet.conf — вставить ВНУТРЬ существующего блока https://agentcoin.work на H1
# Не создавать второй site-блок! Это только handle для моста с локального линукса.
# На H1 мост виден как 127.0.0.1:19335 (см. bridge-local-to-h1.sh).
# Проверка на H1: curl -s http://127.0.0.1:19335/life

# /habitat-local -> твоя локальная нода через мост (для проверки другом)
handle /habitat-local* {
  reverse_proxy 127.0.0.1:19335
}

# /life-local -> /life твоей локальной ноды (чтобы друг сверил tip не трогая прод)
handle /life-local {
  reverse_proxy 127.0.0.1:19335
}
