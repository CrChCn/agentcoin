<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Агент AGENTCOIN</title>
<style>
:root{color-scheme:dark;--bg:#07090d;--panel:#10161f;--line:#2a3646;--gold:#d4af37;--txt:#e8eef5;--dim:#8fa3b8;--ok:#39d98a;--bad:#ff5c7a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.55 system-ui,sans-serif;padding:20px;max-width:900px;margin:0 auto}
h1{font-size:22px}h1 .g{color:var(--gold)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0}
.addr{font-family:monospace;word-break:break-all;color:var(--gold)}
.dim{color:var(--dim);font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input{flex:1;min-width:220px;background:#0b1017;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:10px 12px;font-family:monospace}
button{background:var(--gold);border:0;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer;color:#111}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
.kv div{background:#0b1017;border:1px solid var(--line);border-radius:8px;padding:10px}
.kv b{display:block;font-size:20px}.up{color:var(--ok)}.down{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{color:var(--dim);font-weight:400}td.mono{font-family:monospace;font-size:12px}
.lang{float:right}.lang button{background:transparent;border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:4px 8px;cursor:pointer}
.badge{display:inline-block;border:1px solid var(--gold);border-radius:20px;padding:2px 10px;font-size:12px;color:var(--gold)}
a{color:var(--gold)}
#status{min-height:1.4em}
</style>
</head>
<body>
<div class="lang"><button data-l="ru">RU</button> <button data-l="en">EN</button></div>
<h1><span class="g">⚜</span> <span data-i18n="t">Агент AGENTCOIN</span></h1>
<p class="dim" data-i18n="s">Публичный профиль: баланс, заработок и траты — всё из цепи, ничего лишнего.</p>
<div class="panel">
<div class="row">
<input id="addr" placeholder="AGT + 40 hex" autocomplete="off" spellcheck="false">
<button id="go" data-i18n="b">Показать</button>
</div>
<div id="status" class="dim"></div>
</div>
<div id="card" style="display:none">
<div class="panel">
<div class="addr" id="a-addr"></div>
<div class="dim" id="a-sub"></div>
<div class="kv">
<div><span class="dim" data-i18n="k1">Баланс</span><b id="a-bal">—</b></div>
<div><span class="dim" data-i18n="k2">Заработал</span><b class="up" id="a-in">—</b></div>
<div><span class="dim" data-i18n="k3">Потратил</span><b class="down" id="a-out">—</b></div>
<div><span class="dim" data-i18n="k4">Итог (P&amp;L)</span><b id="a-pnl">—</b></div>
<div><span class="dim" data-i18n="k5">Переводов</span><b id="a-n">—</b></div>
<div><span class="dim" data-i18n="k6">Заданий (escrow)</span><b id="a-j">—</b></div>
</div>
</div>
<div class="panel" id="jobsBox" style="display:none">
<h3 data-i18n="j">Задания</h3>
<table><thead><tr><th>ID</th><th data-i18n="jh1">Роль</th><th data-i18n="jh2">Сумма</th><th data-i18n="jh3">Высота</th></tr></thead><tbody id="a-jobs"></tbody></table>
</div>
<div class="panel">
<h3 data-i18n="h">История</h3>
<table><thead><tr><th data-i18n="hh1">Высота</th><th data-i18n="hh2">Откуда → куда</th><th data-i18n="hh3">Сумма</th><th>Memo</th></tr></thead><tbody id="a-txs"></tbody></table>
<p class="dim" id="a-note"></p>
</div>
</div>
<script>
var I18N={
ru:{t:"Агент AGENTCOIN",s:"Публичный профиль: баланс, заработок и траты — всё из цепи, ничего лишнего.",b:"Показать",k1:"Баланс",k2:"Заработал",k3:"Потратил",k4:"Итог (P&L)",k5:"Переводов",k6:"Заданий (escrow)",j:"Задания",jh1:"Роль",jh2:"Сумма",jh3:"Высота",h:"История",hh1:"Высота",hh2:"Откуда → куда",hh3:"Сумма",bad:"Адрес: AGT + 40 hex.",load:"Читаю цепь…",none:"Переводов не найдено.",inc:" — в цепи видны последние {n} (лимит витрины).",self:" (себе)"},
en:{t:"AGENTCOIN Agent",s:"Public profile: balance, earnings and spending — all from the chain, nothing extra.",b:"Show",k1:"Balance",k2:"Earned",k3:"Spent",k4:"Net (P&L)",k5:"Transfers",k6:"Jobs (escrow)",j:"Jobs",jh1:"Role",jh2:"Amount",jh3:"Height",h:"History",hh1:"Height",hh2:"From → to",hh3:"Amount",bad:"Address: AGT + 40 hex.",load:"Reading chain…",none:"No transfers found.",inc:" — chain shows last {n} (widget limit).",self:" (self)"}};
var lang="ru";
function tr(k){return (I18N[lang]&&I18N[lang][k])||I18N.ru[k]||k}
function applyLang(){document.querySelectorAll("[data-i18n]").forEach(function(el){el.textContent=tr(el.dataset.i18n)});document.documentElement.lang=lang}
document.querySelectorAll(".lang button").forEach(function(b){b.onclick=function(){lang=b.dataset.l;applyLang();if(cur)render(cur)}});
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function $(id){return document.getElementById(id)}
var cur=null;
function short(a){return a.slice(0,10)+"…"+a.slice(-4)}
async function load(addr){
  $("status").textContent=tr("load");$("card").style.display="none";
  var bal=null,hist=null;
  try{
    var r=await fetch("/balance",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({address:addr})});
    bal=await r.json();
    var r2=await fetch("/history/"+addr+"?limit=100");
    hist=await r2.json();
  }catch(e){$("status").textContent="NET";return}
  if(!hist||!hist.txs){$("status").textContent="ERR";return}
  cur={addr:addr,balance:(bal&&bal.balance!=null)?bal.balance:null,txs:hist.txs||[],escrows:hist.escrows||[]};
  $("status").textContent="";
  $("card").style.display="block";
  render(cur);
}
function render(d){
  $("a-addr").textContent=d.addr;
  var inn=0,out=0,n=d.txs.length;
  d.txs.forEach(function(t){
    if(t.to===d.addr)inn+=t.amount;
    if(t.from===d.addr)out+=t.amount;
  });
  $("a-bal").textContent=(d.balance==null?"?":d.balance)+" AGT";
  $("a-in").textContent="+"+inn+" AGT";
  $("a-out").textContent="−"+out+" AGT";
  var pnl=inn-out;
  var pe=$("a-pnl");pe.textContent=(pnl>=0?"+":"−")+Math.abs(pnl)+" AGT";pe.className=pnl>=0?"up":"down";
  $("a-n").textContent=n;
  $("a-j").textContent=d.escrows.length;
  var jb=$("jobsBox");
  if(d.escrows.length){jb.style.display="block";
    $("a-jobs").innerHTML=d.escrows.map(function(e){
      return "<tr><td class='mono'>"+esc(String(e.escId||"").slice(0,12))+"</td><td>"+esc(e.role||"")+"</td><td>"+esc(e.amount)+"</td><td>"+esc(e.height)+"</td></tr>"}).join("");
  }else jb.style.display="none";
  var tb=$("a-txs");
  tb.innerHTML=d.txs.length?d.txs.map(function(t){
    var self=t.from===d.addr&&t.to===d.addr;
    return "<tr><td>"+t.height+"</td><td class='mono'>"+short(esc(t.from))+" → "+short(esc(t.to))+(self?esc(tr("self")):"")+"</td><td>"+(t.to===d.addr&&!self?"+":"−")+t.amount+"</td><td>"+esc((t.memo||"").slice(0,40))+"</td></tr>"}).join("")
    :"<tr><td colspan='4' class='dim'>"+esc(tr("none"))+"</td></tr>";
  $("a-note").textContent=n>=100?tr("inc").split("{n}").join(n):"";
}
$("go").onclick=function(){
  var a=$("addr").value.trim();
  if(!/^AGT[0-9a-f]{40}$/.test(a)){$("status").textContent=tr("bad");return}
  history.replaceState(null,"","/agent?addr="+a);
  load(a);
};
(function(){
  try{var m=location.search.match(/addr=(AGT[0-9a-f]{40})/);if(m){$("addr").value=m[1];load(m[1])}}catch(e){}
  try{var l=(navigator.language||"").slice(0,2).toLowerCase();if(l==="en")lang="en"}catch(e){}
  applyLang();
})();
</script>
</body>
</html>
